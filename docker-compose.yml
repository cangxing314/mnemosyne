# 老陈铁匠铺 —— 一键把 Web 版跑起来
#
#   docker compose up -d --build   构建并后台启动
#   docker compose logs -f         看日志（老陈的启动提示在这）
#   docker compose down            停掉（数据留在命名卷里，不会丢）
#   docker compose down -v         停掉并**清空数据**（想要一个全新世界时用）
#
# 起来后浏览器开：http://127.0.0.1:8000
#   （系统开了 HTTP 代理的话别用 localhost——可能不在代理绕过列表里，用 127.0.0.1 直连）

services:
  mnemosyne:
    build: .
    image: mnemosyne:latest
    container_name: mnemosyne
    ports:
      - "8000:8000"

    # 密钥从 .env 读（DEEPSEEK_API_KEY 驱动对话、DASHSCOPE_API_KEY 做嵌入和裁判）。
    # 镜像里没有 .env——密钥永远不进镜像层，这是刻意的。
    env_file:
      - .env

    # DNS：显式指定国内公共 DNS。
    # 默认的解析转发会把 dashscope.aliyuncs.com 解析到错误 IP（实测容器内为
    # 8.152.159.24，宿主侧为 39.96.198.249）→ 连到错误节点、TLS 握手被切。
    # 指定 DNS 后解析结果与宿主侧一致。
    dns:
      - 223.5.5.5        # 阿里公共 DNS
      - 119.29.29.29     # 腾讯公共 DNS

    # 显式清空容器内的代理。
    # 容器会继承宿主的代理设置（HTTP_PROXY → host.docker.internal）；宿主代理不可达时，
    # 调用 DeepSeek / DashScope 会先撞代理、报"连接被拒"，表现为服务不可用。
    # 这三家 API 国内直连可达，不需要代理 → 清空，使容器不依赖宿主代理状态。
    # 空字符串 = 不设置代理；NO_PROXY 再兜一层本地回环（健康检查用）。
    environment:
      # 容器必须绑 0.0.0.0（所有网卡），否则宿主机的 127.0.0.1:8000 转发不进来。
      # 本地直接跑 python 时不用设——bootstrap.py 默认就是 127.0.0.1。
      MNEMOSYNE_HOST: "0.0.0.0"
      PORT: "8000"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "127.0.0.1,localhost"
      no_proxy: "127.0.0.1,localhost"

    # 数据持久化：world.db（世界状态+记忆+日志）、checkpoints.db（存档）、
    # chroma/（向量库）全在 /app/data 下。容器删了重建，老陈还记得你。
    #
    # 用命名卷而非 ./data 目录挂载：
    # 每轮对话都要写 SQLite（turn_log / memories），而在 Windows 上把宿主目录 bind
    # 进容器时，SQLite 需穿过 Docker Desktop 的文件系统翻译层，容易出现加锁失败或
    # 明显变慢（Linux 无此问题）。命名卷位于容器自身文件系统，行为与 Linux 一致。
    # 代价：不能用 Windows 资源管理器直接看库文件；要看用
    #   docker compose exec mnemosyne python -c "..."   或先 `docker cp` 出来。
    # 想改成直接挂目录（方便用本地工具看数据）就把下面两行换成：
    #   - ./data:/app/data
    volumes:
      - mnemosyne-data:/app/data

    restart: unless-stopped

    # 健康检查用 python 而不是 curl：slim 镜像里没有 curl，别为了探活再装一个包
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s   # bootstrap 要建表+灌种子+索引 28 条 lore（要连调嵌入 API），给足时间

volumes:
  mnemosyne-data:
